[workspace]
resolver = "2"
members = ["crates/ljos-cli", "crates/ljos-hud"]

[workspace.package]
version = "0.25.0"
edition = "2021"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/leidarljos/ljos"
homepage = "https://leidarljos.github.io"
description = "Memory, a work tracker and a shell-command gate for coding agents over MCP and hooks."

[workspace.dependencies]
rmcp = { version = "3.2", features = ["server", "transport-io", "transport-async-rw", "macros", "elicitation"] }
schemars = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "signal"] }
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
packset-client = "0.9.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
which = "7"
vissue-core = "0.20"
